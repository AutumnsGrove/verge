# The machine image, baked in a runner and published as a workflow artifact.
#
# Deliberately not a release asset and deliberately not in the repository: an image is
# hundreds of megabytes of somebody else's operating system, and this repository holds
# source. The artifact is the build output, and it is enough for testing against a real
# provider; a release pipeline can promote it later if that is ever wanted.
#
# It bakes exactly what the README says the image owes: the tailnet agent, verge-join and
# verge-save. Nothing is fetched at boot, which is the property internal/cloudinit depends
# on -- and nothing is fetched while building it either, beyond the pinned tarballs: the
# appliance that edits the disk has no resolver, and a version pinned here is a build that
# does not change when nobody touched it.
#
# No KVM on GitHub-hosted runners, so this does not boot anything: libguestfs edits the
# vendor's cloud image offline, which is slower than a VM boot and does not need nested
# virtualisation.
name: image

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Ubuntu cloud image to build on
        default: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
        type: string
  push:
    tags: ["v*"]
    # Temporary: a workflow cannot be dispatched until it exists on the default branch, so
    # this branch is how the first run is tested. Remove before merging.
    branches: [feat/image-ci]

permissions:
  contents: read

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The same two binaries an installed host would have, built the same way.
      - run: make dist

      - name: Install the tooling that edits a disk image without booting it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-utils zstd

      - name: Fetch the base image
        run: |
          set -euo pipefail
          curl -fsSL -o base.img "${{ inputs.base_image || 'https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img' }}"
          qemu-img info base.img | head -5

      - name: Bake the image
        run: |
          set -euo pipefail
          arch_dir="$(ls -d dist/verge-*-linux-amd64)"
          mkdir -p overlay

          # Pinned, and fetched here rather than inside the image: the appliance that edits
          # the disk has no resolver, and a version resolved at build time is a build that
          # changes when nobody touched it. The static tarball needs no packages, which is
          # also why this works on a minimal cloud image.
          ts_version="1.104.7"
          curl -fsSL -o tailscale.tgz "https://pkgs.tailscale.com/stable/tailscale_${ts_version}_amd64.tgz"
          tar -xzf tailscale.tgz --strip-components=1 -C overlay \
            "tailscale_${ts_version}_amd64/tailscale" \
            "tailscale_${ts_version}_amd64/tailscaled"

          cp -a "$arch_dir/verge-join" overlay/verge-join
          cp -a "$arch_dir/verge-save" overlay/verge-save
          cat > overlay/tailscaled.service <<'UNIT'
          [Unit]
          Description=Tailscale node agent
          After=network-pre.target
          Wants=network-pre.target

          [Service]
          ExecStart=/usr/local/bin/tailscaled
          Restart=on-failure
          StateDirectory=tailscale

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo virt-customize -a base.img \
            --copy-in overlay/tailscaled:/usr/local/bin \
            --copy-in overlay/tailscale:/usr/local/bin \
            --copy-in overlay/verge-join:/usr/local/bin \
            --copy-in overlay/verge-save:/usr/local/bin \
            --copy-in overlay/tailscaled.service:/etc/systemd/system \
            --chmod 0755:/usr/local/bin/tailscaled \
            --chmod 0755:/usr/local/bin/tailscale \
            --chmod 0755:/usr/local/bin/verge-join \
            --chmod 0755:/usr/local/bin/verge-save \
            --run-command 'mkdir -p /etc/verge /workspace' \
            --run-command '/usr/local/bin/tailscaled --version' \
            --run-command '/usr/local/bin/tailscale --version' \
            --run-command 'systemctl enable tailscaled' \
            --run-command 'test -x /usr/local/bin/verge-join && test -x /usr/local/bin/verge-save'

      - name: Shrink and compress
        run: |
          set -euo pipefail
          qemu-img convert -O qcow2 -c base.img image.qcow2
          zstd -T0 -19 -o verge-image.qcow2.zst image.qcow2
          ls -lh base.img image.qcow2 verge-image.qcow2.zst
          sha256sum verge-image.qcow2.zst > verge-image.qcow2.zst.sha256

      # The artifact name comes from the ref, and a branch ref contains slashes, which an
      # artifact name cannot: sanitised rather than templated, so a branch and a tag both
      # produce a name rather than one of them failing after a twenty-minute build.
      - name: Name the artifact
        run: echo "IMAGE_ARTIFACT=verge-image-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      # The artifact is the image. It is not a release asset and never enters the tree.
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.IMAGE_ARTIFACT }}
          path: |
            verge-image.qcow2.zst
            verge-image.qcow2.zst.sha256
          retention-days: 14
          compression-level: 0
